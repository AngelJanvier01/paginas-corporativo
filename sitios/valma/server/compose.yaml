services:
  valma:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: valma-sitio:local
    restart: unless-stopped
    env_file: /home/janvier/apps/valma-secrets/smtp.env
    ports:
      - "127.0.0.1:3012:3000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
